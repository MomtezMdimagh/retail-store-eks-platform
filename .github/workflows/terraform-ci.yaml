name: terraform-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive -diff .

      # validate, tflint, and checkov jobs are added in PR 3 alongside the first
      # Terraform module — they require `terraform init` and would fail on an empty tree.
