apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: adot-metrics
  namespace: observability
spec:
  mode: deployment
  serviceAccount: adot-metrics-collector
  config:
    receivers:
      prometheus:
        config:
          global:
            # Wider than the tight defaults some reference setups use - AMP bills per ingested
            # sample, so scrape interval is the real cost lever here, not a retention setting.
            scrape_interval: 60s
          scrape_configs:
            - job_name: kube-state-metrics
              kubernetes_sd_configs:
                - role: endpoints
                  namespaces:
                    names: [kube-system]
              relabel_configs:
                - source_labels: [__meta_kubernetes_service_name]
                  regex: kube-state-metrics
                  action: keep
            - job_name: node-exporter
              kubernetes_sd_configs:
                - role: endpoints
                  namespaces:
                    names: [kube-system]
              relabel_configs:
                - source_labels: [__meta_kubernetes_service_name]
                  regex: prometheus-node-exporter
                  action: keep
    processors:
      batch: {}
      # Drop the highest-cardinality, least-useful series before they're ever ingested into AMP.
      filter/drop_high_cardinality:
        error_mode: ignore
        metrics:
          metric:
            - 'name == "container_tasks_state"'
            - 'name == "container_memory_failures_total"'
    exporters:
      prometheusremotewrite: # the current exporter - not the deprecated awsprometheusremotewrite
        # Must match `terraform output amp_remote_write_endpoint` from
        # infrastructure/live/prod/70-observability - filled in once that layer is applied.
        endpoint: "<amp_remote_write_endpoint>"
        auth:
          authenticator: sigv4auth
    extensions:
      sigv4auth:
        region: us-east-1
        service: aps
    service:
      extensions: [sigv4auth]
      pipelines:
        metrics:
          receivers: [prometheus]
          processors: [filter/drop_high_cardinality, batch]
          exporters: [prometheusremotewrite]
