# Image tag is promoted manually - a reviewed PR copies a proven dev tag here. No CI writes to this file.
image:
  repository: 652197205931.dkr.ecr.us-east-1.amazonaws.com/retail-store/cart
  tag: "0.1.0"

fullnameOverride: cart

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

serviceAccount:
  name: cart

# CPU-only target, deliberately - cart is JVM-based (see values-ui.yaml's comment on why memory
# targets don't pair well with JVM services).
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: "50%"
  maxUnavailable: null # the chart defaults this to 1; PDBs reject minAvailable + maxUnavailable together

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/instance: cart
    matchLabelKeys:
      - pod-template-hash

# No capacity-type nodeSelector - cart can tolerate spot interruption.
