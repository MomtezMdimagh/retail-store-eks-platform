apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: orders-db
  namespace: default
spec:
  provider: aws
  parameters:
    # Must match `terraform output orders_secret_arn` from infrastructure/live/dev/50-data-plane -
    # an RDS-managed master-user secret, JSON keys {username, password, ...}. Fill in before
    # applying, per docs/runbooks/deploy.md.
    objects: |
      - objectName: "<FILL IN AFTER 50-data-plane APPLIES: terraform output orders_secret_arn>"
        objectType: "secretsmanager"
        jmesPath:
          - path: "username"
            objectAlias: "username"
          - path: "password"
            objectAlias: "password"
  # Mounting isn't actually used - the orders chart reads its DB credentials from a plain k8s
  # Secret via envFrom, not a mounted file (same as catalog's). secretObjects is what does the
  # real work: it re-publishes the values above as a Kubernetes Secret with the exact keys the
  # chart's own (unused, since app.persistence.secret.create is false) secret-db.yaml template
  # would have produced. Note the key name is USERNAME here, not USER like catalog's - the two
  # charts genuinely differ on this, confirmed by reading both templates.
  secretObjects:
    - secretName: orders-db
      type: Opaque
      data:
        - objectName: "username"
          key: RETAIL_ORDERS_PERSISTENCE_USERNAME
        - objectName: "password"
          key: RETAIL_ORDERS_PERSISTENCE_PASSWORD
