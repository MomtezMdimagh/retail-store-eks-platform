# The secrets-store-csi-driver only writes a SecretProviderClass's `secretObjects` into a real
# Kubernetes Secret as a side effect of some pod mounting it as a CSI volume - there's no
# mount-independent sync mode. Neither the catalog nor the orders chart (vendored from
# retail-store-sample-app, unmodified) has any hook to mount a CSI volume itself, so nothing
# would ever trigger the sync without this. These two tiny, otherwise-pointless pods exist solely
# to hold each mount open so the driver keeps `catalog-db`/`orders-db` populated - a documented,
# common workaround for exactly this situation, not a real workload.
#
# Two separate Deployments, not one mounting both volumes: each service's Pod Identity role only
# has secretsmanager:GetSecretValue on its own secret (least privilege, set up back in PR 7), so
# each helper has to run as that same service account to be allowed to read it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-sync-helper-catalog
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secret-sync-helper-catalog
  template:
    metadata:
      labels:
        app: secret-sync-helper-catalog
    spec:
      serviceAccountName: catalog
      containers:
        - name: pause
          image: public.ecr.aws/eks-distro/kubernetes/pause:3.9
          volumeMounts:
            - name: catalog-db-creds
              mountPath: /mnt/catalog-db
              readOnly: true
      volumes:
        - name: catalog-db-creds
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: catalog-db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-sync-helper-orders
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secret-sync-helper-orders
  template:
    metadata:
      labels:
        app: secret-sync-helper-orders
    spec:
      serviceAccountName: orders
      containers:
        - name: pause
          image: public.ecr.aws/eks-distro/kubernetes/pause:3.9
          volumeMounts:
            - name: orders-db-creds
              mountPath: /mnt/orders-db
              readOnly: true
      volumes:
        - name: orders-db-creds
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: orders-db
