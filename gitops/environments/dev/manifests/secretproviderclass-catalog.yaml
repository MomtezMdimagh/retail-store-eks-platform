apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: catalog-db
  namespace: default
spec:
  provider: aws
  parameters:
    # This project uses EKS Pod Identity, never IRSA. The AWS provider defaults to IRSA and fails the
    # mount with 'token for audience sts.amazonaws.com not found' unless told otherwise.
    usePodIdentity: "true"
    # Must match `terraform output catalog_secret_arn` from infrastructure/live/dev/50-data-plane -
    # an RDS-managed master-user secret, JSON keys {username, password, ...}. Fill in before
    # applying, per docs/runbooks/deploy.md.
    objects: |
      - objectName: "arn:aws:secretsmanager:us-east-1:652197205931:secret:rds!db-8507de76-9d95-4090-a584-b6681da8d8c5-uc0sgi"
        objectType: "secretsmanager"
        jmesPath:
          - path: "username"
            objectAlias: "username"
          - path: "password"
            objectAlias: "password"
  # Mounting isn't actually used - the catalog chart reads its DB credentials from a plain k8s
  # Secret via envFrom, not a mounted file. secretObjects is what does the real work: it
  # re-publishes the values above as a Kubernetes Secret with the exact keys the chart's own
  # (unused, since app.persistence.secret.create is false) secret.yaml template would have
  # produced, so nothing downstream needs to know these credentials came from Secrets Manager.
  secretObjects:
    - secretName: catalog-db
      type: Opaque
      data:
        - objectName: "username"
          key: RETAIL_CATALOG_PERSISTENCE_USER
        - objectName: "password"
          key: RETAIL_CATALOG_PERSISTENCE_PASSWORD
