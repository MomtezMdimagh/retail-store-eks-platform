# Image tag is updated automatically by the app repo's CI (PR 9) on every successful build.
# repository points at our own ECR, not the chart's public.ecr.aws default - the CI-built image
# only ever lands in ours.
image:
  repository: 652197205931.dkr.ecr.us-east-1.amazonaws.com/retail-store/orders
  tag: "sha-43e782c"

fullnameOverride: orders

# Points the chart at the real RDS instance instead of its in-memory default. endpoint/secret ARN
# only exist once infrastructure/live/dev/50-data-plane is applied - fill in from
# `terraform output orders_endpoint` and the SecretProviderClass in
# gitops/environments/dev/manifests/secretproviderclass-orders.yaml, per docs/runbooks/deploy.md.
# Order events go to the real SQS queue from infrastructure/modules/data-plane/orders-postgres.
# Needs a chart built from the app fork with the SQS values (MomtezMdimagh/retail-store-sample-app#4,
# upstream aws-containers/retail-store-sample-app#1147). Credentials come from the orders Pod
# Identity role; region from IMDS (EC2NodeClass hop limit is 2).
app:
  messaging:
    provider: sqs
    sqs:
      topic: "retail-store-eks-dev-orders"

  persistence:
    provider: postgres
    endpoint: "retail-store-eks-dev-orders-postgres.ccj0scyk4vhv.us-east-1.rds.amazonaws.com:5432"
    database: "orders"
    secret:
      create: false
      name: orders-db

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

serviceAccount:
  name: orders

# CPU-only target, deliberately - orders is JVM-based (see values-ui.yaml's comment).
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: "50%"
  maxUnavailable: null # the chart defaults this to 1; PDBs reject minAvailable + maxUnavailable together

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/instance: orders
    matchLabelKeys:
      - pod-template-hash

# orders is more sensitive to interruption than ui/catalog/cart - keep it on stable, on-demand
# capacity rather than letting Karpenter place it on spot.
nodeSelector:
  karpenter.sh/capacity-type: on-demand
