# Image tag is updated automatically by the app repo's CI (PR 9) on every successful build.
# repository points at our own ECR, not the chart's public.ecr.aws default - the CI-built image
# only ever lands in ours.
image:
  repository: 652197205931.dkr.ecr.us-east-1.amazonaws.com/retail-store/ui
  tag: "sha-43e782c"

fullnameOverride: ui

# In-cluster service DNS names for the other 4 services. All plain k8s Service names, not AWS
# resources - each matches its own fullnameOverride in its own values file.
app:
  endpoints:
    catalog: http://catalog:80
    carts: http://cart:80
    orders: http://orders:80
    checkout: http://checkout:80

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# CPU-only target, deliberately - ui is JVM-based, and a memory target on a JVM service is a real
# trap: heap doesn't shrink back down after a load spike, so the HPA scales up and never scales
# back down again.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: "50%" # a percentage, not a fixed count, so it tracks min/maxReplicas automatically
  maxUnavailable: null # the chart defaults this to 1; PDBs reject minAvailable + maxUnavailable together

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway # soft - a hard constraint risks Pending pods in a dev/demo env
    labelSelector:
      matchLabels:
        app.kubernetes.io/instance: ui
    matchLabelKeys:
      - pod-template-hash # avoids a rolling-update deadlock between old and new ReplicaSet pods

# No capacity-type nodeSelector - ui can tolerate spot interruption, so Karpenter is free to use
# either NodePool from PR 6.
