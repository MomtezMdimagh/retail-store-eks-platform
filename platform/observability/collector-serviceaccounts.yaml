# The three ADOT collectors name their service accounts explicitly (so each gets its own
# least-privilege Pod Identity role from infrastructure/modules/observability). When a collector
# names its service account, the OpenTelemetry operator expects it to exist and does not create
# it - without these, every collector pod is rejected with "serviceaccount ... not found".
apiVersion: v1
kind: ServiceAccount
metadata:
  name: adot-traces-collector
  namespace: observability
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: adot-logs-collector
  namespace: observability
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: adot-metrics-collector
  namespace: observability
---
# The metrics collector's Prometheus receiver discovers kube-state-metrics and node-exporter
# through the Kubernetes API (kubernetes_sd_configs role: endpoints), so it needs read access
# to the objects that discovery walks.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: adot-metrics-collector
rules:
  - apiGroups: [""]
    resources: ["endpoints", "services", "pods", "nodes", "nodes/metrics"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: adot-metrics-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: adot-metrics-collector
subjects:
  - kind: ServiceAccount
    name: adot-metrics-collector
    namespace: observability
